services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: kavas-frontend
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

